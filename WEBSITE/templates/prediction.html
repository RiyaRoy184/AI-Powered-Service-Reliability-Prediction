<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Prediction | Smart Healthcare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #eef3f8;
        }

        .sidebar {
            position: fixed;
            width: 250px;
            height: 100vh;
            background: #0d6efd;
            padding-top: 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,.15);
        }

        .sidebar h3 {
            color: white;
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: white;
            color: #0d6efd;
        }

        .sidebar i {
            width: 25px;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,.07);
        }

        .section-title {
            color: #0d6efd;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-control,
        .form-select {
            height: 45px;
            border-radius: 8px;
        }

    </style>

</head>

<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <h3>
        <i class="fa-solid fa-hospital"></i>
        Smart Healthcare
    </h3>

    <a href="{{ url_for('dashboard') }}">
        <i class="fa-solid fa-house"></i>
        Dashboard
    </a>

    <a href="{{ url_for('prediction') }}" class="active">
        <i class="fa-solid fa-brain"></i>
        AI Prediction
    </a>

    <a href="{{ url_for('devices') }}">
        <i class="fa-solid fa-laptop-medical"></i>
        Devices
    </a>

    <a href="{{ url_for('history') }}">
        <i class="fa-solid fa-clock-rotate-left"></i>
        History
    </a>

    <a href="{{ url_for('analytics') }}">
        <i class="fa-solid fa-chart-line"></i>
        Analytics
    </a>

    <a href="{{ url_for('reports') }}">
        <i class="fa-solid fa-file-medical"></i>
        Reports
    </a>

    <a href="{{ url_for('profile') }}">
        <i class="fa-solid fa-user"></i>
        Profile
    </a>

</div>


<div class="main">

    <h2 class="text-primary">
        <i class="fa-solid fa-brain"></i>
        AI Reliability Prediction
    </h2>

    <p class="text-muted">
        Enter the medical device information below.
    </p>


    <form method="POST" action="{{ url_for('predict') }}">

        <div class="form-card">


            <!-- DEVICE -->

            <h4 class="section-title">

                <i class="fa-solid fa-laptop-medical"></i>

                Device Information

            </h4>


            <div class="row g-3">


                <div class="col-md-4">

                    <label class="form-label">
                        Device Type
                    </label>

                    <select
                        name="Device_Type"
                        class="form-select"
                        required>

                        <option value="">
                            Select Device
                        </option>

                        <option value="Defibrillator">
                            Defibrillator
                        </option>

                        <option value="Infusion Pump">
                            Infusion Pump
                        </option>

                        <option value="MRI Scanner">
                            MRI Scanner
                        </option>

                        <option value="X-Ray Machine">
                            X-Ray Machine
                        </option>

                        <option value="PET Scanner">
                            PET Scanner
                        </option>

                        <option value="CT Scanner">
                            CT Scanner
                        </option>

                    </select>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Device Age (Years)
                    </label>

                    <input
                        type="number"
                        name="Age"
                        class="form-control"
                        step="0.1"
                        min="0"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Manufacturer
                    </label>

                    <select
                        name="Manufacturer"
                        class="form-select"
                        required>

                        <option value="">
                            Select Manufacturer
                        </option>

                        <option value="CardioSync">
                            CardioSync
                        </option>

                        <option value="MedEquip">
                            MedEquip
                        </option>

                        <option value="ImagingTech">
                            ImagingTech
                        </option>

                        <option value="RescueTech">
                            RescueTech
                        </option>

                        <option value="UltraMed">
                            UltraMed
                        </option>

                        <option value="ScanPro">
                            ScanPro
                        </option>

                    </select>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Model
                    </label>

                    <select
                        name="Model"
                        class="form-select"
                        required>

                        <option value="">
                            Select Model
                        </option>

                        <option value="Model-100">Model-100</option>
                        <option value="Model-150">Model-150</option>
                        <option value="Model-200">Model-200</option>
                        <option value="Model-250">Model-250</option>
                        <option value="Model-300">Model-300</option>
                        <option value="Model-350">Model-350</option>
                        <option value="Model-400">Model-400</option>
                        <option value="Model-450">Model-450</option>
                        <option value="Model-500">Model-500</option>
                        <option value="Model-550">Model-550</option>
                        <option value="Model-600">Model-600</option>
                        <option value="Model-650">Model-650</option>

                    </select>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Country
                    </label>

                    <select
                        name="Country"
                        class="form-select"
                        required>

                        <option value="">
                            Select Country
                        </option>

                        <option value="France">France</option>
                        <option value="Italy">Italy</option>
                        <option value="UK">UK</option>
                        <option value="Canada">Canada</option>
                        <option value="Japan">Japan</option>
                        <option value="USA">USA</option>

                    </select>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Maintenance Cost
                    </label>

                    <input
                        type="number"
                        name="Maintenance_Cost"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>

            </div>


            <!-- MAINTENANCE -->

            <h4 class="section-title mt-5">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                Maintenance Information

            </h4>


            <div class="row g-3">


                <div class="col-md-4">

                    <label class="form-label">
                        Downtime (Hours)
                    </label>

                    <input
                        type="number"
                        name="Downtime"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Maintenance Frequency
                    </label>

                    <input
                        type="number"
                        name="Maintenance_Frequency"
                        class="form-control"
                        min="1"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Failure Event Count
                    </label>

                    <input
                        type="number"
                        name="Failure_Event_Count"
                        class="form-control"
                        min="0"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Maintenance Class
                    </label>

                    <input
                        type="number"
                        name="Maintenance_Class"
                        class="form-control"
                        min="1"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Operational Hours
                    </label>

                    <input
                        type="number"
                        name="Operational_Hours_Est"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Expected Lifespan
                    </label>

                    <input
                        type="number"
                        name="Expected_Lifespan_Est"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        MTBF
                    </label>

                    <input
                        type="number"
                        name="MTBF"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Cost Per Hour
                    </label>

                    <input
                        type="number"
                        name="Cost_Per_Hour"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>


                <div class="col-md-4">

                    <label class="form-label">
                        Lifespan Usage Ratio
                    </label>

                    <input
                        type="number"
                        name="Lifespan_Usage_Ratio"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required>

                </div>

            </div>


            <div class="text-center mt-5">

                <button
                    type="submit"
                    class="btn btn-primary btn-lg px-5">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                    Predict Reliability

                </button>

            </div>

        </div>

    </form>

</div>

</body>
</html>
